# Trecho para o server { } de azovah.com (nginx)
# Pastas no servidor: /var/www/azovah/lp (conteúdo de site/), /var/www/azovah/links (conteúdo de blink/)

location /lp/    { alias /var/www/azovah/lp/;    try_files $uri $uri/ /lp/index.html; }
location /links/ { alias /var/www/azovah/links/; try_files $uri $uri/ /links/index.html; }

# Máscaras curtas para a bio do Instagram: todas levam para /links/
location = /links { return 301 /links/; }
location = /bio   { return 301 /links/; }
location = /ig    { return 301 /links/; }
location = /lp    { return 301 /lp/; }
